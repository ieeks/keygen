name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Auch auf Pull Requests, damit eine Regression vor dem Merge auffaellt und
  # nicht erst beim Deploy. Der deploy-Job laeuft dabei nicht, siehe if unten.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-Test
        run: node scripts/smoke-test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    # Nur der Deploy serialisiert auf Pages — sonst wuerde ein PR-Lauf einen
    # laufenden Deploy abbrechen.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nur die App veroeffentlichen. Mit path: '.' landeten auch CLAUDE.md,
      # SETUP.md und prompts/ auf der Live-Site. Neue statische Assets muessen
      # hier bewusst ergaenzt werden — Allowlist, nicht Ausschlussliste.
      - name: Publish-Verzeichnis aufbauen
        run: |
          mkdir -p _site
          cp index.html _site/
          echo "Inhalt des Pages-Artefakts:"
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
